<html>
    <head>
        <style>
            #hi1{
                background-color: red;
                width: 200px;
                height: 30px;
            }
            #hi2{
                background-color: blue;
                width: 200px;
                height: 30px;
            }
            #hi3{
                background-color: green;
                width: 200px;
                height: 30px;
            }
        </style>
    </head>
    <body>
        <div id="hi1">
            This is first division.
        </div><br>
        <div id="hi2">
            This is second division.
        </div><br>
        <div id="hi3">
            This is third division.
        </div><br>
        <button id="button">
            Click me
        </button>
        <script>
                const button=document.getElementById("button");
                const div1=document.getElementById("hi1");
                const div2=document.getElementById("hi2");
                const div3=document.getElementById("hi3");

                button.addEventListener("click",function(){
                    button.innerText="Clicked";

                div1.style.backgroundColor="blue";
                div2.style.backgroundColor="green";
                div3.style.backgroundColor="red";
                div1.style.border="2px solid green";
                div2.style.border="2px solid yellow";
                div3.style.border="2px solid blue";
                div1.style.borderRadius="30px";
                div2.style.borderRadius="30px";
                });
                
            

        </script>
    </body>
</html>
